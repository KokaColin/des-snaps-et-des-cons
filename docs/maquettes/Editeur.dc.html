<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Éditeur de meme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Bangers&amp;family=Archivo:wght@500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#f3ecdc}a:hover{color:#ffe433}
.meme{font-family:Anton,Impact,sans-serif;color:#fff;text-align:center;text-transform:uppercase;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:2px 2px 0 #000}
.tool{min-height:44px;border:2px solid #f3ecdc;background:transparent;color:#f3ecdc;font:700 14px Archivo,sans-serif;padding:0 12px}
.sw{width:32px;height:32px;border:0;border-radius:50%;padding:0}
.punk{display:inline-block;font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:1.5px;color:#f3ecdc;text-shadow:1px 1px 0 #ff4d8d,-1px 0 0 #ffe433;transform:skew(-8deg) rotate(-2deg)}
.burst{clip-path:polygon(50% 0%,61% 17%,83% 7%,79% 29%,100% 32%,85% 49%,99% 68%,77% 71%,82% 94%,61% 83%,49% 100%,38% 82%,15% 93%,22% 70%,0% 64%,16% 47%,2% 28%,23% 27%,19% 5%,39% 17%)}
.big{min-height:62px;border:0;font-family:Bangers,Impact,sans-serif;font-size:30px;letter-spacing:2px;line-height:1;color:#17161b;transform:skew(-6deg) rotate(-1deg);box-shadow:6px 6px 0 #000;transition:transform .08s,box-shadow .08s;cursor:pointer}
.big:active{transform:skew(-6deg) rotate(-1deg) translate(4px,4px);box-shadow:2px 2px 0 #000}
.big:disabled{background:transparent;color:#8a8373;border:3px dashed #5a554b;box-shadow:none;cursor:not-allowed}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 20px 22px; display: flex; flex-direction: column; gap: 14px; background-color: #17161b; background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 5px 5px; font-family: Archivo, system-ui, sans-serif; color: #f3ecdc; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between">
<span class="punk" style="font-size: 32px">MANCHE 1<span style="font-size: 0.62em">/3</span></span>
<span style="font-family: Archivo, sans-serif; font-weight: 600; font-size: 13px; color: #d8d0bd">3/5 ont validé</span>
<span style="display: flex; align-items: center; gap: 8px" aria-label="Temps restant 1:12"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#3a3833" stroke-width="4"></circle><circle cx="15" cy="15" r="12" fill="none" stroke="#f3ecdc" stroke-width="4" stroke-dasharray="60.3 75.4" transform="rotate(-90 15 15)"></circle></svg><span style="font-family: Bangers, Impact, sans-serif; font-size: 26px; line-height: 1; color: #f3ecdc; font-variant-numeric: tabular-nums">1:12</span></span>
</div>

<div style="position: relative; align-self: center; width: 288px; padding: 10px 10px 12px; background: #f3ecdc; transform: rotate(-1deg); box-shadow: 5px 5px 0 #000">
<div style="position: absolute; top: -12px; left: 18px; width: 70px; height: 22px; background: rgba(255,228,51,0.85); transform: rotate(-8deg)"></div>
<div style="position: relative; height: 330px; background-color: #3a3530; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 10px, transparent 10px 20px); display: grid; place-items: center">
<span style="font-family: Archivo, sans-serif; font-weight: 600; font-size: 13px; color: #b9b19f">[ photo du groupe ]</span>
<div style="position: absolute; top: 14px; left: 10px; right: 10px; padding: 4px; outline: 2px dashed #ffe433; outline-offset: 2px">
<div class="meme" style="font-size: 26px; line-height: 1.05">Quand tu dis « juste un verre »</div>
</div>
<div style="position: absolute; bottom: 38px; left: 0; right: 0; padding: 7px 10px; background: rgba(0,0,0,0.62); color: #fff; font: 600 15px Archivo, sans-serif; text-align: center">et qu'il est 4h du mat</div>
</div>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: Archivo, sans-serif; font-weight: 600; font-size: 13px; color: #d8d0bd">Texte sélectionné</span>
<input value="Quand tu dis « juste un verre »" style="min-height: 46px; box-sizing: border-box; padding: 0 12px; border: 2px solid #f3ecdc; background: #f3ecdc; color: #17161b; font: 600 16px Archivo, sans-serif">
</label>

<div style="display: flex; gap: 8px">
<button class="tool" style="flex: 1; background: #f3ecdc; color: #17161b">Classique</button>
<button class="tool" style="flex: 1">Bandeau Snap</button>
<button class="tool" aria-label="Texte plus petit">A−</button>
<button class="tool" aria-label="Texte plus grand">A+</button>
</div>

<div style="display: flex; justify-content: space-between; align-items: center" aria-label="Couleur du texte">
<button class="sw" style="background: #ffffff; box-shadow: 0 0 0 3px #ffe433" aria-label="Blanc"></button>
<button class="sw" style="background: #111111; border: 2px solid #f3ecdc" aria-label="Noir"></button>
<button class="sw" style="background: #ffe433" aria-label="Jaune"></button>
<button class="sw" style="background: #ff3b30" aria-label="Rouge"></button>
<button class="sw" style="background: #ff4d8d" aria-label="Rose"></button>
<button class="sw" style="background: #3e8bff" aria-label="Bleu"></button>
<button class="sw" style="background: #3ddc84" aria-label="Vert"></button>
<button class="sw" style="background: #ff8a1f" aria-label="Orange"></button>
</div>

<div style="display: flex; gap: 8px">
<button class="tool" style="flex: 1">+ Texte <span style="font-family: Archivo, sans-serif; font-weight: 600; font-weight: 400">(2/3)</span></button>
<button class="tool" style="flex: 1">Changer d'image <span style="font-family: Archivo, sans-serif; font-weight: 600; font-weight: 400">(1)</span></button>
</div>

<button class="big" style="margin-top: auto; background: #ff4d8d">Valider mon meme</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
